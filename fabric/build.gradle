plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${rootProject.mod_name}-fabric-${rootProject.fabric_minecraft_version}"
}

// Compile the shared game logic from ../common against Fabric's Minecraft, into the main
// (common-environment) source set. The split client source set holds client-only classes.
sourceSets.main.java.srcDir "${rootDir}/common/src/main/java"

loom {
    splitEnvironmentSourceSets()

    mods {
        "voxyworldgenv2" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/' }
    // Sodium, for its config API: Sodium replaces the vanilla video settings screen, so adding
    // our options to that screen means going through its API rather than mixing into vanilla.
    exclusiveContent {
        forRepository { maven { url "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.fabric_cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"
    // compileOnly: Sodium is optional at runtime, the integration is guarded by its entrypoint
    // Sodium replaces the vanilla video settings screen, so our rows go in through its config
    // API. compileOnly on the client source set: Sodium is optional at runtime and the
    // integration only loads if Sodium resolves its entrypoint. MC 26.2 jars are unobfuscated,
    // so no remapping step is needed to compile against a mod jar.
    clientCompileOnly "maven.modrinth:sodium:${rootProject.sodium_version}"

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", rootProject.mod_version
    inputs.property "minecraft_version", rootProject.fabric_minecraft_version
    inputs.property "loader_version", rootProject.fabric_loader_version

    filesMatching("fabric.mod.json") {
        expand "version": rootProject.mod_version,
                "minecraft_version": rootProject.fabric_minecraft_version,
                "loader_version": rootProject.fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    // Use a Java 25 toolchain so the compile targets 25 regardless of which JDK launched Gradle
    // (the foojay resolver in settings.gradle locates/downloads it if needed).
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from("${rootDir}/LICENSE") {
        rename { "${it}_${rootProject.mod_name}" }
    }
}

// Loom's splitEnvironmentSourceSets() creates a separate `client` source set. Tests need to see
// both it and main, otherwise client-only classes (ClientStorageReporter in plan 3) are invisible
// to their tests even though they share a package.
sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.client.output
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output
    }
}

configurations {
    testImplementation.extendsFrom implementation
    testRuntimeOnly.extendsFrom runtimeOnly
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
    }
}
