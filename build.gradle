plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_name}-${minecraft_version}"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.fabric_loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = 21
    targetCompatibility = 21
}

// Loom does not always propagate the remapped Minecraft classpath to the test source set,
// and SyncedChunkStore (Task 2) needs fastutil, which arrives transitively from Minecraft.
// Adding it explicitly is inert when Loom already did it.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
}

// dev: property-guarded client run configs for macOS Zink smoke testing.
// -PzinkRun replicates the env the voxy repo's build.fabric.gradle.kts injects for
// scripts/macos/run-zink-client.sh (Mesa/Zink + KosmicKrisp + patched GLFW); Loom does
// not forward -D args or DYLD_* env from the invoking shell, so they must go through
// the Loom run-config DSL. -PautoJoin adds a fixed offline username and auto-joins the
// local test server. -PgeomBufMB=<n> caps Voxy's geometry buffer (Zink cannot service
// the ~4GB default allocation).
if (project.hasProperty("zinkRun")) {
    // Voxy's release jar nests rocksdbjni / lwjgl-lmdb / lwjgl-zstd with ONLY
    // linux64+win64 natives; on macOS its RocksDB storage backend hard-crashes at
    // world join ("librocksdbjni-osx-arm64.jnilib was not found inside JAR").
    // Supplying the full artifacts on the dev runtime classpath lets the JNI
    // loaders find the mac natives via parent-classloader resource lookup —
    // same approach the voxy repo's own dev env uses.
    dependencies {
        localRuntime "org.rocksdb:rocksdbjni:10.2.1"
        localRuntime "org.lwjgl:lwjgl-zstd:3.3.3:natives-macos-arm64"
        localRuntime "org.lwjgl:lwjgl-lmdb:3.3.3:natives-macos-arm64"
    }
    def home = System.getProperty("user.home")
    def mesaDirProp = (project.findProperty("mesaDir") ?: "mesa-native").toString()
    def mesa = mesaDirProp.startsWith("/") ? mesaDirProp : "$home/$mesaDirProp"
    def glfwLib = "$home/src/glfw/build/src/libglfw.3.dylib"
    def interposeLib = file("$mesa/lib/libgl_interpose.dylib")
    loom.runs.named("client") {
        environmentVariable("DYLD_LIBRARY_PATH", "$mesa/lib")
        environmentVariable("LIBGL_DRIVERS_PATH", "$mesa/lib/dri")
        environmentVariable("VK_DRIVER_FILES", "$mesa/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json")
        environmentVariable("EGL_PLATFORM", "surfaceless")
        environmentVariable("MESA_LOADER_DRIVER_OVERRIDE", "zink")
        environmentVariable("MESA_GL_VERSION_OVERRIDE", "4.6")
        environmentVariable("MESA_GLSL_VERSION_OVERRIDE", "460")
        if (interposeLib.exists()) {
            environmentVariable("DYLD_INSERT_LIBRARIES", interposeLib.absolutePath)
        }
        vmArg("-Dorg.lwjgl.egl.libname=$mesa/lib/libEGL.dylib")
        vmArg("-Dorg.lwjgl.opengl.libname=$mesa/lib/libGL.dylib")
        vmArg("-Dorg.lwjgl.glfw.libname=$glfwLib")
        vmArg("-Djoml.nounsafe=true")
        if (project.hasProperty("geomBufMB")) {
            vmArg("-Dvoxy.geometryBufferSizeOverrideMB=" + project.property("geomBufMB"))
        }
        programArgs("--width", "854", "--height", "480")
    }
}
if (project.hasProperty("autoJoin")) {
    loom.runs.named("client") {
        programArgs("--username", "VoxyTester", "--quickPlayMultiplayer", "localhost:25565")
    }
}
